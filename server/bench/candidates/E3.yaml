    languages: "*"
    license: paper CC BY 4.0; FLAMO framework MIT
    sources: [research:E3:1, compute-tiers:E3:spark]
    verified: {license: true, languages: false, vram: false, runs: false}
    notes: >-
      Götz et al. (arXiv 2510.23158) VAE-embedding + differentiable FDN; FLAMO (pip flamo) is the
      framework, but the trained acoustic-embedding VAE is not released — no runnable matcher yet.
