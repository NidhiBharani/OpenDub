# F4 — on-screen text replacement. Sources: model-research.html (#F4, 10 rows), compute-tiers.html
# (#F4 picks/alternates), docs/model-candidates-by-compute.md. Spec: bench/arena/specs/f4.py.
# Pack: f4_overlay_synth (known boxes, clean plates, hand translations; lang = target).
# Image editors edit the mid-span keyframe and the box region is pasted into the span
# (static overlays; planar tracking for moving text is out of scope for this pack).
capability: F4
candidates:
  - id: passthrough
    url: server/bench/arena/workers/f_passthrough.py  # own method (in this repo)
    params_b: 0
    worker: f_passthrough
    env: server
    kind: method
    params: {}
    languages: "*"
    license: n/a
    ship_ok: true
    requires: {}
    baseline: true
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: Today's behaviour — nothing is replaced (the floor for ocr_cer / src_leak).

  - id: overlay-plate-template
    url: server/bench/arena/workers/f4_overlay.py  # own method (in this repo)
