name: d5_kokoro
python: ~/.opendub/envs/d5_kokoro/bin/python
description: "Kokoro-82M via kokoro 0.9.4 + misaki[en,ja] (unidic dictionary downloaded)"
setup:
  x86_64:
    - "uv venv {prefix} --python 3.12"
    - "uv pip install --python {python} --torch-backend cu128 torch==2.11.0 torchaudio==2.11.0"
    - "uv pip install --python {python} kokoro==0.9.4 'misaki[en,ja]==0.9.4' soundfile"
    - "{python} -m unidic download"
  aarch64:
    - "uv venv {prefix} --python 3.12"
    - "uv pip install --python {python} --torch-backend cu130 torch==2.11.0 torchaudio==2.11.0"
    - "uv pip install --python {python} kokoro==0.9.4 'misaki[en,ja]==0.9.4' soundfile"
    - "{python} -m unidic download"
check: "import kokoro, misaki; print('ok')"
notes: "Runs on CPU too. pyopenjtalk (misaki[ja]) builds from source on aarch64 (cmake)."
