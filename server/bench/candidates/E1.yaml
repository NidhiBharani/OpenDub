# E1 — timing fit + pause mapping. Sources: data/research/model-research.html (#E1 ledger, ranks
# 1–8) and data/research/compute-tiers.html (#E1 Spark / Unconstrained / API picks + alternates).
# All runnable candidates are CPU DSP: they land on Thalassa, the Spark and API-only boxes alike.
capability: E1
candidates:
  - id: atempo-app
    url: server/app/pipeline/audio.py (fit_to_duration; ffmpeg atempo)
    params_b: 0
    worker: e1_atempo
    kind: local
    params: {max_rate: 1.15, min_rate: 0.85}
    languages: "*"
    license: LGPL-2.1-or-later (ffmpeg)
    ship_ok: true
    requires: {tools: [ffmpeg]}
    baseline: true
    sources: [research:E1:8]
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: >-
      timing_fit.atempo as shipped: app.pipeline.audio.fit_to_duration (trim outer silence, speed
      up ≤1.15×, never slow down, pad). Beyond 1.15× the app regenerates; the arena keeps the
      clamped take and scores it as an overflow.
  - id: atempo-uniform
    url: https://ffmpeg.org/ffmpeg-filters.html#atempo
    params_b: 0
    worker: e1_timefit
    kind: local
    params: {mode: uniform, backend: atempo, min_rate: 0.7, max_rate: 1.4}
    languages: "*"
    license: LGPL-2.1-or-later (ffmpeg)
    ship_ok: true
    requires: {tools: [ffmpeg]}
    sources: [research:E1:8]
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: scalar stretch of the speech span onto the source speech span (both directions)
  - id: rubberband-r3-uniform
    url: https://breakfastquay.com/rubberband/
    params_b: 0
    worker: e1_timefit
    kind: local
    params: {mode: uniform, backend: rubberband, engine: finer, min_rate: 0.7, max_rate: 1.4}
    languages: "*"
    license: GPL-2.0-or-later (commercial licence available)
    ship_ok: true
    requires: {tools: [rubberband]}
    sources: [research:E1:3, compute-tiers:E1:spark-alt]
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: >-
      Rubber Band CLI R3 (-3 --formant -D), shelled out and never linked, so the GPL stays outside
      the Apache-2.0 artefact. Install: apt install rubberband-cli (x86_64 and arm64 packages).
  - id: signalsmith-uniform
    url: https://github.com/Signalsmith-Audio/signalsmith-stretch
    params_b: 0
    worker: e1_timefit
    env: e1_signalsmith
    kind: local
    params: {mode: uniform, backend: signalsmith, min_rate: 0.7, max_rate: 1.4}
    languages: "*"
    license: MIT
    ship_ok: true
    requires: {}
    sources: [research:E1:2]
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: Signalsmith Stretch via the third-party python-stretch 0.3.1 binding (sdist build on aarch64)
  - id: pause-dp+atempo
    url: https://arxiv.org/abs/2204.02530
    params_b: 0
    worker: e1_timefit
    kind: method
    params: {mode: pause_dp, backend: atempo, rate_dev: 0.10, min_rate: 0.7, max_rate: 1.4,
             w_rate: 4.0, pen_take: 0.05, pen_src: 0.3, min_gap: 0.08}
    languages: "*"
    license: Apache-2.0 (in-house DP) + LGPL ffmpeg
    ship_ok: true
    requires: {tools: [ffmpeg]}
    sources: [research:E1:1]
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: in-house prosodic-alignment DP (no reference implementation exists) with WSOLA residual
  - id: pause-dp+rubberband-r3
    url: https://arxiv.org/abs/2204.02530
    params_b: 0
    worker: e1_timefit
    kind: method
    params: {mode: pause_dp, backend: rubberband, engine: finer, rate_dev: 0.10, min_rate: 0.7,
             max_rate: 1.4, w_rate: 4.0, pen_take: 0.05, pen_src: 0.3, min_gap: 0.08}
    languages: "*"
    license: Apache-2.0 (in-house DP) + GPL-2.0-or-later CLI
    ship_ok: true
    requires: {tools: [rubberband]}
    sources: [research:E1:1, research:E1:3, compute-tiers:E1:spark-alt]
    verified: {license: true, languages: true, vram: true, runs: false}
  - id: pause-dp+signalsmith
    url: https://arxiv.org/abs/2204.02530
    params_b: 0
    worker: e1_timefit
    env: e1_signalsmith
    kind: method
    params: {mode: pause_dp, backend: signalsmith, rate_dev: 0.10, min_rate: 0.7, max_rate: 1.4,
             w_rate: 4.0, pen_take: 0.05, pen_src: 0.3, min_gap: 0.08}
    languages: "*"
    license: Apache-2.0 (in-house DP) + MIT
    ship_ok: true
    requires: {}
    sources: [research:E1:1, research:E1:2, compute-tiers:E1:spark]
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: the research's Spark pick (pause-structure DP + Signalsmith residual stretch)
  # ---- registered, not runnable as an E1 post stage
  - id: duration-controlled-regen
    url: https://arxiv.org/abs/2505.20899
    worker: e1_regen
    kind: method
    enabled: false
    languages: "*"
    license: per paper (Dub-S2ST, duration-based translation)
    ship_ok: false
    sources: [research:E1:4, compute-tiers:E1:big]
    verified: {license: false, languages: false, vram: false, runs: false}
    notes: >-
      Regenerating the take at the slot length (Dub-S2ST, best-of-N) replaces E1 rather than
      post-processing a take; it is ranked under D3 (duration control) / D8 (S2ST), not here.
