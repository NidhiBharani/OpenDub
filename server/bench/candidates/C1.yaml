    extra_body:
      chat_template_kwargs: {enable_thinking: false}
    task: segment
  languages: [en, hi, ja]
  license: Apache-2.0
  ship_ok: true
  requires: {gpu: true, vram_gb: 44, disk_gb: 30}
  sources: ['compute-tiers:C1:alt']
  verified: {license: true, languages: false, vram: false, runs: false}
  notes: 'Dense 27B VL (hybrid Gated DeltaNet), 262K context; Spark (FP8 official). The artifact''s NVFP4
