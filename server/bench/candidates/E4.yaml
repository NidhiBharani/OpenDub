  - id: harmony-search-automix
    url: https://joshreiss.github.io/documents/2025/Liu2025JAESAutomaticMixingSpeech.pdf
    params_b: 0
    worker: e4_harmony_search
    enabled: false
    languages: "*"
    license: paper only (Liu & Reiss, JAES 2025)
    sources: [compute-tiers:E4:big]
    verified: {license: false, languages: false, vram: false, runs: false}
