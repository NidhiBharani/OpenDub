# A6 — diarization with overlap. Sources: model-research A6 ledger (8 rows) and compute-tiers A6
# picks + alternates, deduplicated. Joint ASR+diarization workers are shared with A4.
capability: A6
candidates:
  - id: pyannote-3.1
    worker: a6_pyannote
    env: a6_pyannote3
    kind: local
    params: {model: pyannote/speaker-diarization-3.1}
    url: https://huggingface.co/pyannote/speaker-diarization-3.1
    languages: "*"
    license: MIT
    ship_ok: true
    requires: {gpu: true, vram_gb: 2, api_keys: [HF_TOKEN]}
    baseline: true
    sources: [plan:model-ranking:7]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: OpenDub's diarization.pyannote provider; gated repo (accept terms, HF_TOKEN). Card DER VoxConverse 11.3
  - id: single-speaker
    worker: a6_single_speaker
    env: server
    kind: method
    params: {floor_db: 35, min_gap: 0.3}
    url: https://github.com/NidhiBharani/OpenDub
    languages: "*"
    license: n/a
    ship_ok: true
    requires: {}
    sources: [plan:capability-map:A6]
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: OpenDub's default diarization.single_speaker (energy VAD, one speaker) — the DER floor
