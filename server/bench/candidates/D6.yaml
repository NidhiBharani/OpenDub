# D6 — voice conversion.
# Rows from both research artifacts: data/research/model-research.html ledger (research:D6:<rank>)
# and data/research/compute-tiers.html picks (compute-tiers:D6:spark|big|api, alternates *-alt),
# docs/model-candidates-by-compute.md and plan §7 (plan:§7:D6).
# requires places each row: vram ≤ 15 → Thalassa (x86_64 16 GB) and Spark; vram > 16 → Spark only;
# arch [x86_64] where deps have no aarch64 wheels; kind api → API keys. d_unwired = registered only.
capability: D6
candidates:
- id: vevo2-fm
  worker: d6_vevo2
  env: d6_vevo2
  kind: local
  params: {mode: fm, flow_matching_steps: 32}
  languages: [en, zh, ja, ko, de, fr]
  license: CC-BY-NC-ND-4.0 (checkpoints); Amphion code MIT
  ship_ok: false
  requires: {gpu: true, vram_gb: 4, disk_gb: 6}
  sources: ['research:D6:1', 'compute-tiers:D6:spark']
  verified: {license: true, languages: true, vram: false, runs: false}
  notes: Timbre conversion, style preserved (inference_fm). ~3 GB per compute-tiers.
  url: https://huggingface.co/RMSnow/Vevo2
  params_b: 0.87
- id: vevo2-ar-fm
  worker: d6_vevo2
  env: d6_vevo2
  kind: local
  params: {mode: ar_fm}
  languages: [en, zh, ja, ko, de, fr]
  license: CC-BY-NC-ND-4.0 (checkpoints); Amphion code MIT
  ship_ok: false
  requires: {gpu: true, vram_gb: 6, disk_gb: 6}
  sources: ['research:D6:1']
  verified: {license: true, languages: true, vram: false, runs: false}
  notes: Style-converted VC via inference_ar_and_fm with the source transcript (inputs.text).
  url: https://huggingface.co/RMSnow/Vevo2
  params_b: 0.87
- id: elevenlabs-voice-changer
  worker: d1_elevenlabs
  env: server
  kind: api
  params: {model: eleven_multilingual_sts_v2, mode: sts, output_format: pcm_24000}
  languages: [en, ja, zh, de, hi, fr, ko, pt, it, es, id, nl, tr, fil, pl, sv, bg, ro, ar, cs, el, fi,
    hr, ms, sk, da, ta, uk, ru]
  license: proprietary API
  ship_ok: true
  requires:
    api_keys: [ELEVENLABS_API_KEY]
  sources: ['research:D6:2', 'compute-tiers:D6:api']
  verified: {license: false, languages: false, vram: false, runs: false}
  notes: Mirrors app/providers/tts/elevenlabs.py; IVC voices are deleted at job end. Prices in _cost_usd
    are estimates.
  url: https://elevenlabs.io/docs/api-reference/text-to-speech/convert
- id: x-vc
