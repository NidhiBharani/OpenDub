[project]
name = "opendub-server"
version = "0.1.0"
description = "OpenDub — voice-preserving video dubbing pipeline with pluggable OSS/cloud models"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
separation = ["demucs>=4.0", "torch>=2.2", "torchaudio>=2.2"]
diarization = ["pyannote.audio>=3.1"]
tts = ["f5-tts>=1.1"]
# benchmarking harness extras (ground-truth metrics). All lazy-imported: without them the bench
# still runs and reference-free metrics still compute; GT metrics report null with a reason.
bench = ["jiwer>=3.0", "sacrebleu>=2.4", "soundfile>=0.12", "numpy>=1.26"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
