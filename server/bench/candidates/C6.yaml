capability: C6
candidates:
- id: wrap-only
  worker: c6_rules
  env: server
  kind: local
  params: {}
  languages: '*'
  license: MIT (OpenDub)
  ship_ok: true
  requires: {}
  baseline: true
  sources: ['plan:§7:C6']
  verified: {license: true, languages: true, vram: true, runs: false}
  notes: Greedy re-wrap to CPL, no condensation (no C6 provider today).
  url: server/bench/arena/workers/c6_rules.py
- id: hwtsc-qwen3-32b-fp8
