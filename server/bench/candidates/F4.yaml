    env: server
    kind: method
    params: {plate: true}
    languages: "*"
    license: n/a (own implementation; Noto fonts SIL OFL 1.1)
    ship_ok: true
    requires: {}
    sources: ["research:F4:1"]
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: >-
      Research verdict: ship this first. Colour-matched opaque plate + rendered translation, and a
      JSON cue template for a finisher. Deterministic; looks like a localisation plate.

  - id: clear-render
    url: https://huggingface.co/charlesw09/CLEAR-mask-free-video-subtitle-removal
    params_b: 1.3
    worker: f4_clear
    env: f4_clear
    kind: local
    params: {lora_rank: 64, lora_scale: 1.0, num_steps: 5, cfg_scale: 1.0, sliding_window: true,
             render: true}
    languages: "*"
    license: Apache-2.0 (CLEAR code + LoRA; base Wan2.1-Fun-V1.1-1.3B-Control Apache-2.0)
    ship_ok: true
    requires: {gpu: true, vram_gb: 14, disk_gb: 25}
    sources: ["research:F4:2", "compute-tiers:F4:spark-alt", "compute-tiers:F4:big-alt"]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: >-
      Mask-free subtitle eraser (zero-shot en/ko/fr/ja/ru/de) + the overlay renderer without a
      plate. 4.86 s/frame in the paper. VRAM is an estimate for a 1.3B Wan2.1 control model at
      the pack's 1280x720 (not stated upstream). Repo 3cd19a2c; the README's base-model line is
      wrong (the code loads Wan2.1-Fun-V1.1-1.3B-Control).

