# C5 — text normalization / G2P / lexicon. Pack language = <lang>.<task> (en.tn, hi.g2p, ja.kana …);
# a candidate lists only the packs it can do. LLM candidates use params.task: c5 (task from
# the pack).
capability: C5
candidates:
- id: nemo-tn
  worker: c5_nemo_tn
  env: c5_nemo
  kind: local
  params: {input_case: cased}
  languages: [en.tn, hi.tn, ja.tn]
  license: Apache-2.0
  ship_ok: true
  requires:
    arch: [x86_64]
    ram_gb: 4
    disk_gb: 2
  sources: ['research:C5:2', 'compute-tiers:C5:spark', 'plan:§7:C5']
  verified: {license: true, languages: true, vram: true, runs: false}
  notes: nemo-text-processing 1.2.0 WFST (CPU); hi TN new in 1.2.0. x86_64 only (pynini wheels); grammars
    compile on first use.
  url: https://github.com/NVIDIA/NeMo-text-processing
- id: misaki
  worker: c5_misaki
  env: c5_misaki
  kind: local
  params: {}
  languages: [en.g2p, ja.g2p]
  license: Apache-2.0
  ship_ok: true
  requires: {}
  sources: ['research:C5:1', 'compute-tiers:C5:spark', 'plan:§7:C5']
  verified: {license: true, languages: true, vram: true, runs: false}
  notes: Fallback disabled (OOV = error). No Hindi. Unmaintained since 2025-08.
  url: https://github.com/hexgrad/misaki
- id: espeak-ng
  worker: c5_espeak
  env: server
  kind: local
  params: {}
  languages: [en.g2p, hi.g2p, ja.g2p]
  license: GPL-3.0
  ship_ok: true
  requires:
    tools: [espeak-ng]
  sources: ['research:C5:6', 'compute-tiers:C5:spark', 'plan:§7:C5']
  verified: {license: true, languages: false, vram: true, runs: false}
  notes: Shelled out, never linked (GPL). Install espeak-ng (not on Thalassa yet).
  url: https://github.com/espeak-ng/espeak-ng
- id: charsiu-byt5-small
  worker: c5_charsiu
  env: c5_charsiu
  kind: local
  params: {model: charsiu/g2p_multilingual_byT5_small_100}
  languages: [en.g2p, hi.g2p, ja.g2p]
  license: unknown (code MIT)
  ship_ok: null
  requires: {gpu: true, vram_gb: 1.5, disk_gb: 1.5}
  sources: ['research:C5:4', 'compute-tiers:C5:alt', 'plan:§7:C5']
  verified: {license: false, languages: true, vram: false, runs: false}
  notes: ~300M ByT5; 100 languages incl. hi. Model card states no licence. Frozen (weights 2022). Language
    codes eng-us/hin/jpn assumed.
  url: https://huggingface.co/charsiu/g2p_multilingual_byT5_small_100
  params_b: 0.3
- id: epitran
  worker: c5_epitran
  env: c5_epitran
  kind: local
  params: {}
  languages: [hi.g2p, ja.g2p]
  license: MIT
  ship_ok: true
  requires: {}
  sources: ['compute-tiers:C5:alt']
  verified: {license: false, languages: false, vram: true, runs: false}
  notes: Rule-based hin-Deva / jpn-Hira.
  url: https://github.com/dmort27/epitran
- id: pyopenjtalk
  worker: c5_pyopenjtalk
  env: c5_misaki
  kind: local
  params: {}
  languages: [ja.kana]
  license: 'MIT (OpenJTalk: Modified BSD)'
  ship_ok: true
  requires: {}
  sources: ['compute-tiers:C5:spark']
  verified: {license: false, languages: false, vram: true, runs: false}
  notes: misaki's Japanese backend; katakana readings.
  url: https://github.com/r9y9/pyopenjtalk
- id: qwen3-14b-awq-arbiter
  worker: c2_openai_compat
  env: c2_vllm
  kind: local
  params:
    backend: vllm
    model: Qwen/Qwen3-14B-AWQ
    server_args: [--max-model-len, '8192', --gpu-memory-utilization, '0.85']
    extra_body:
      chat_template_kwargs: {enable_thinking: false}
    task: c5
  languages: [en.tn, hi.tn, ja.tn, en.g2p, hi.g2p, ja.g2p, ja.kana]
  license: Apache-2.0
  ship_ok: true
  requires: {gpu: true, vram_gb: 14, disk_gb: 10}
  sources: ['compute-tiers:C5:spark']
  verified: {license: true, languages: true, vram: false, runs: false}
  notes: 'AWQ int4 (~9.5 GB weights) on vLLM with thinking disabled; vLLM reserves 85% of the card. Card:
    100+ languages incl. hi/ja. Local 8-30B arbiter (here: every item, not only flagged homographs).'
  url: https://huggingface.co/Qwen/Qwen3-14B-AWQ
  params_b: 14.8
- id: qwen3.8-27b-fp8-arbiter
  worker: c2_openai_compat
  env: c2_vllm
  kind: local
  params:
    backend: vllm
    model: Qwen/Qwen3.8-27B-FP8
    server_args: [--max-model-len, '16384', --gpu-memory-utilization, '0.4']
    extra_body:
      chat_template_kwargs: {enable_thinking: false}
    task: c5
  languages: [en.tn, hi.tn, ja.tn, en.g2p, hi.g2p, ja.g2p, ja.kana]
  license: Apache-2.0
  ship_ok: true
  requires: {gpu: true, vram_gb: 44, disk_gb: 30}
  sources: ['compute-tiers:C5:spark']
  verified: {license: true, languages: false, vram: false, runs: false}
  notes: 'Dense 27B VL (hybrid Gated DeltaNet), 262K context; Spark (FP8 official). The artifact''s NVFP4
    recipe is faster but NVFP4 on GB10 is immature. The card lists no languages: hi/ja unverified. enable_thinking
    assumed to follow Qwen3.'
  url: https://huggingface.co/Qwen/Qwen3.8-27B-FP8
  params_b: 27.0
