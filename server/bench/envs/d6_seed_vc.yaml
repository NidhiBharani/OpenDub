name: d6_seed_vc
python: ~/.opendub/envs/d6_seed_vc/bin/python
description: "Seed-VC (Plachtaa/seed-vc, GPL-3.0) from its repo (inference.py CLI)"
setup:
  x86_64:
    - "uv venv {prefix} --python 3.12"
    - "uv pip install --python {python} --torch-backend cu128 torch==2.11.0 torchaudio==2.11.0"
    - "test -d {home}/.opendub/src/seed-vc || git clone https://github.com/Plachtaa/seed-vc {home}/.opendub/src/seed-vc && git -C {home}/.opendub/src/seed-vc checkout 51383efd921027683c89e5348211d93ff12ac2a8"
    - "uv pip install --python {python} -r {home}/.opendub/src/seed-vc/requirements.txt"
  aarch64:
    - "uv venv {prefix} --python 3.12"
    - "uv pip install --python {python} --torch-backend cu130 torch==2.11.0 torchaudio==2.11.0"
    - "test -d {home}/.opendub/src/seed-vc || git clone https://github.com/Plachtaa/seed-vc {home}/.opendub/src/seed-vc && git -C {home}/.opendub/src/seed-vc checkout 51383efd921027683c89e5348211d93ff12ac2a8"
    - "uv pip install --python {python} -r {home}/.opendub/src/seed-vc/requirements.txt"
check: "import torch; assert torch.cuda.is_available()"
notes: "requirements.txt pins an older torch for Windows/Linux; installing it may downgrade torch — if so, reinstall the arch torch step afterwards. Suggested python is 3.10."
