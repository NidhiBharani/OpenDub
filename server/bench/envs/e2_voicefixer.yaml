name: e2_voicefixer
python: ~/.opendub/envs/e2_voicefixer/bin/python
description: VoiceFixer 0.1.3 (MIT) speech restoration, 44.1 kHz vocoder (weights download on first use)
setup:
  x86_64:
    - uv venv {prefix} --python 3.10
    - uv pip install --python {python} torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cu128
    - uv pip install --python {python} voicefixer==0.1.3
  aarch64:
    - uv venv {prefix} --python 3.10
    - uv pip install --python {python} torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cu130
    - uv pip install --python {python} voicefixer==0.1.3
check: "from voicefixer import VoiceFixer; import torch; assert torch.cuda.is_available()"
notes: voicefixer pins librosa<0.9 era APIs; unverified with torch 2.11.
