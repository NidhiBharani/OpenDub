name: c6_suber
python: ~/.opendub/envs/c6_suber/bin/python
description: SubER judge (subtitle-edit-rate 0.4.0, Apache-2.0); CPU, pure Python.
setup:
  x86_64:
    - uv venv {prefix} --python 3.12
    - uv pip install --python {python} subtitle-edit-rate==0.4.0
  aarch64:
    - uv venv {prefix} --python 3.12
    - uv pip install --python {python} subtitle-edit-rate==0.4.0
check: "import suber"
