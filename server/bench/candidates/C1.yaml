# C1 — dub-line segmentation (timed word list → speakable lines). Pack language = source
# language. LLM candidates reuse the C2 workers with params.task: segment.
capability: C1
candidates:
- id: pause-splitter
  worker: c1_pause
  env: server
  kind: local
  params: {min_pause: 0.35, max_line_seconds: 12.0}
  languages: '*'
  license: MIT (OpenDub)
  ship_ok: true
  requires: {}
  baseline: true
  sources: ['research:C1:6', 'plan:§7:C1']
  verified: {license: true, languages: true, vram: true, runs: false}
  notes: 'segmentation.pause: split on pauses ≥ 0.35 s or sentence ends, cap 12 s.'
  url: server/app/pipeline/segmentation.py
- id: sat-12l-sm
  worker: c1_sat
  env: c1_sat
  kind: local
  params: {model: segment-any-text/sat-12l-sm}
  languages: '*'
  license: MIT
  ship_ok: true
  requires: {gpu: true, vram_gb: 1.5, disk_gb: 1.5}
  sources: ['research:C1:1', 'compute-tiers:C1:spark', 'plan:§7:C1']
  verified: {license: true, languages: true, vram: false, runs: false}
  notes: 0.3B, 85 languages; boundary probs drive the pause/duration DP search.
  url: https://huggingface.co/segment-any-text/sat-12l-sm
  params_b: 0.3
- id: sat-3l-sm
  worker: c1_sat
  env: c1_sat
  kind: local
  params: {model: segment-any-text/sat-3l-sm}
  languages: '*'
  license: MIT
  ship_ok: true
  requires: {gpu: true, vram_gb: 1, disk_gb: 0.5}
  sources: ['research:C1:1']
  verified: {license: true, languages: true, vram: false, runs: false}
  notes: 'Fast variant (runs on CPU with device: cpu).'
  url: https://huggingface.co/segment-any-text/sat-3l-sm
- id: sat-12l-ted-lora
  worker: c1_sat
  env: c1_sat
  kind: local
  params: {model: segment-any-text/sat-12l, style_or_domain: ted}
  languages: [en, hi, ja]
  license: MIT
  ship_ok: true
  requires: {gpu: true, vram_gb: 1.5, disk_gb: 1.5}
  sources: ['research:C1:1', 'compute-tiers:C1:spark']
  verified: {license: true, languages: true, vram: false, runs: false}
  notes: ASR-style (TED, corrupted text) LoRA; loras/ted2020-corrupted has hi and ja. Language taken from
    the pack.
  url: https://huggingface.co/segment-any-text/sat-12l
  params_b: 0.3
- id: hwtsc-parse-pause
  worker: c1_pause
  env: server
  kind: method
  params: {}
  languages: '*'
  license: n/a
  enabled: false
  sources: ['research:C1:2']
  verified: {license: false, languages: false, vram: false, runs: false}
  notes: 'HW-TSC IWSLT 2024 parsing-informed pause selector: needs a constituency/dependency parser per
    language (not in any env yet); reimplementable.'
  url: https://aclanthology.org/events/iwslt-2024/
- id: shas
  worker: c1_pause
  env: server
  kind: local
  params: {}
  languages: [en]
  license: MIT
  enabled: false
  sources: ['research:C1:4', 'compute-tiers:C1:alt']
  verified: {license: false, languages: false, vram: false, runs: false}
  notes: 'SHAS audio segmentation (MIT): checkpoints only for en/es/fr/it/pt (no hi/ja) and it needs an
    audio-input worker; not written.'
  url: https://github.com/mt-upc/SHAS
  params_b: 0.3
- id: apptek-line-segmenter
  worker: c1_pause
  env: server
  kind: api
  params: {}
  languages: '*'
  license: proprietary
  enabled: false
  sources: ['research:C1:5']
  verified: {license: false, languages: false, vram: false, runs: false}
  notes: 'AppTek neural line segmenter with hard constraints: proprietary.'
  url: https://aclanthology.org/2025.iwslt-1.21/
- id: qwen3-14b-awq-segment
  worker: c2_openai_compat
  env: c2_vllm
  kind: local
  params:
    backend: vllm
    model: Qwen/Qwen3-14B-AWQ
    server_args: [--max-model-len, '8192', --gpu-memory-utilization, '0.85']
    extra_body:
      chat_template_kwargs: {enable_thinking: false}
    task: segment
  languages: [en, hi, ja]
  license: Apache-2.0
  ship_ok: true
  requires: {gpu: true, vram_gb: 14, disk_gb: 10}
  sources: ['plan:§7:C1']
  verified: {license: true, languages: true, vram: false, runs: false}
  notes: 'AWQ int4 (~9.5 GB weights) on vLLM with thinking disabled; vLLM reserves 85% of the card. Card:
    100+ languages incl. hi/ja. Plan seed ''14B LLM''.'
  url: https://huggingface.co/Qwen/Qwen3-14B-AWQ
  params_b: 14.8
- id: qwen3.8-27b-fp8-segment
