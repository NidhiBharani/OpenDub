  - id: rgfvr
    url: https://github.com/batuhanntosun/RG-FVR
    params_b: 1.3
    worker: f2_pgtformer
    kind: local
    languages: "*"
    license: no licence file
    enabled: false
    sources: ["research:F2:2"]
