# D5 — licensed non-cloning (stock / designed) voices.
# Rows from both research artifacts: data/research/model-research.html ledger (research:D5:<rank>)
# and data/research/compute-tiers.html picks (compute-tiers:D5:spark|big|api, alternates *-alt),
# docs/model-candidates-by-compute.md and plan §7 (plan:§7:D5).
# requires places each row: vram ≤ 15 → Thalassa (x86_64 16 GB) and Spark; vram > 16 → Spark only;
# arch [x86_64] where deps have no aarch64 wheels; kind api → API keys. d_unwired = registered only.
capability: D5
candidates:
- id: azure-mai-voice-2
  worker: d5_azure
  env: server
  kind: api
  params:
    voices:
      en: {female: 'en-US-Harper:MAI-Voice-2', male: 'en-US-Ethan:MAI-Voice-2'}
      hi: {female: 'hi-IN-Kavya:MAI-Voice-2', male: 'hi-IN-Dhruv:MAI-Voice-2'}
  languages: [en, hi, de, es, fr, it, ko, nl, pt, ro, ru, th, tr, zh, hu]
  license: proprietary API
  ship_ok: true
  requires:
    api_keys: [AZURE_SPEECH_KEY, AZURE_SPEECH_REGION]
  sources: ['research:D5:1', 'compute-tiers:D5:api']
  verified: {license: false, languages: true, vram: false, runs: false}
  notes: Voice names from the MAI-Voice doc (2026-07-23); no ja-JP voice.
  url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/mai-voices
