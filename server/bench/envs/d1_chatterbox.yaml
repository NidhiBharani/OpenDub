name: d1_chatterbox
python: ~/.opendub/envs/d1_chatterbox/bin/python
description: "Resemble Chatterbox (multilingual TTS, VC, Turbo) via chatterbox-tts 0.1.7"
setup:
  x86_64:
    - "uv venv {prefix} --python 3.12"
    - "uv pip install --python {python} --torch-backend cu128 torch==2.11.0 torchaudio==2.11.0"
    - "uv pip install --python {python} --no-deps chatterbox-tts==0.1.7"
    - "uv pip install --python {python} 'numpy<2' librosa==0.11.0 s3tokenizer transformers==5.2.0 diffusers==0.29.0 'resemble-perth>=1.0.0' conformer==0.3.2 safetensors==0.5.3 spacy-pkuseg pykakasi==2.3.0 pyloudnorm omegaconf huggingface-hub"
  aarch64:
    - "uv venv {prefix} --python 3.12"
    - "uv pip install --python {python} --torch-backend cu130 torch==2.11.0 torchaudio==2.11.0"
    - "uv pip install --python {python} --no-deps chatterbox-tts==0.1.7"
    - "uv pip install --python {python} 'numpy<2' librosa==0.11.0 s3tokenizer transformers==5.2.0 diffusers==0.29.0 'resemble-perth>=1.0.0' conformer==0.3.2 safetensors==0.5.3 spacy-pkuseg pykakasi==2.3.0 pyloudnorm omegaconf huggingface-hub"
check: "import chatterbox, torch; assert torch.cuda.is_available()"
notes: "chatterbox-tts pins torch==2.6.0 (no sm_120 kernels); it is installed --no-deps on top of torch 2.11 with its other pins restored. gradio is left out (UI only)."
