    languages: "*"
    license: proprietary API
    ship_ok: true
    requires: {api_keys: [RESEMBLE_API_KEY]}
    sources: [compute-tiers:A2:api-alt]
    verified: {license: true, languages: false, vram: true, runs: false}
    notes: $0.045 per started minute; the job GET path is inferred from the create docs
  - id: mvsep-denoise
    worker: a1_mvsep
    env: server
    kind: api
    params: {sep_type: 47, add_opt1: 0, stems: {audio: dry}}
    url: https://mvsep.com/full_api
    languages: "*"
    license: proprietary API
    ship_ok: true
    requires: {api_keys: [MVSEP_API_TOKEN]}
    sources: [compute-tiers:A1:api-alt]
    verified: {license: false, languages: false, vram: true, runs: false}
    notes: hosted aufr33 Mel-RoFormer denoise; output stem name fragment "dry" unverified
  - id: anyenhance
    worker: a2_unipase
    env: a2_unipase
    kind: local
    params: {}
    url: https://arxiv.org/abs/2501.15417
    params_b: 0.36
