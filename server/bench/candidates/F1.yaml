# F1 — live-action lip sync. Sources: data/research/model-research.html (#F1 ledger, 10 rows +
# text mentions), data/research/compute-tiers.html (#F1 picks/alternates) and
# docs/model-candidates-by-compute.md. Spec: bench/arena/specs/f1.py.
# Thalassa = RTX 5060 Ti 16 GB x86_64 (no block-swap offload of 14B+ video models);
# Spark = GB10 aarch64 ~112 GB unified. Every 14B/22B video DiT below is Spark-only by VRAM.
capability: F1
candidates:
  # ---------------------------------------------------------------- local, fits Thalassa
  - id: wav2lip-gan
    url: https://github.com/Rudrabha/Wav2Lip
    params_b: 0.04
    worker: f1_wav2lip
    env: f1_wav2lip
    kind: local
    params: {checkpoint: null, resize_factor: 1, pads: "0 10 0 0", nosmooth: false}
    languages: "*"
    license: Wav2Lip weights personal/research/non-commercial only (LRS2); code MIT-style
    ship_ok: false
    requires: {gpu: true, vram_gb: 2, disk_gb: 1}
    baseline: true
    sources: ["research:F1:10"]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: >-
      Today's local baseline (app/providers/lipsync/wav2lip.py). 96x96 mouth; trained against a
      SyncNet expert, so never rank it by SyncNet LSE. Repo HEAD bac9a81e; GAN checkpoint from the
      authors' Google Drive (the env recipe fetches it with gdown).

  - id: latentsync-1.6
    url: https://huggingface.co/ByteDance/LatentSync-1.6
    params_b: 0.9
    worker: f1_latentsync
    env: f1_latentsync
    kind: local
    params: {version: "1.6", unet_config: configs/unet/stage2_512.yaml,
             checkpoint: checkpoints/latentsync_unet.pt, inference_steps: 20,
             guidance_scale: 1.5, enable_deepcache: true, seed: 1247}
    languages: "*"
    license: openrail++ (weights, ByteDance/LatentSync-1.6); code Apache-2.0
    ship_ok: true
    requires: {gpu: true, vram_gb: 15.0, disk_gb: 8}
    sources: ["research:F1:2", "compute-tiers:F1:spark"]
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: >-
      512 px face crop composited back. Measured 15.8 GB process peak on a 16 GB card (README
      says 18 GB); vram_gb is set to 15.0 so the runner's free-VRAM check (needs vram+0.5 GB free)
      admits it on an idle 16 GB card — run it with nothing else resident. Upstream frozen since
      June 2025; repo commit a229c394. The user's working clone (~/sources/LatentSync, torch
      2.11+cu128) can be used by pointing the env python at its .venv and params.repo_dir at it.

  - id: latentsync-1.5
    url: https://huggingface.co/ByteDance/LatentSync-1.5
    params_b: 0.9
    worker: f1_latentsync
    env: f1_latentsync
    kind: local
    params: {version: "1.5", unet_config: configs/unet/stage2.yaml,
             checkpoint: checkpoints/1.5/latentsync_unet.pt, inference_steps: 20,
             guidance_scale: 1.5, enable_deepcache: true, seed: 1247}
    languages: "*"
    license: openrail++ (weights, ByteDance/LatentSync-1.5); code Apache-2.0
    ship_ok: true
    requires: {gpu: true, vram_gb: 9, disk_gb: 8}
    sources: ["research:F1:2"]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: >-
      256 px crop (blurrier teeth than 1.6). README states 8 GB; +10% headroom. Runs from the
      1.6 repo checkout with the 1.5 UNet in checkpoints/1.5/ (unverified that the 1.6 code path
      is byte-identical to the 1.5 release for this checkpoint).

  - id: keysync
    url: https://huggingface.co/toninio19/keysync
    params_b: null
    worker: f1_keysync
    env: f1_keysync
    kind: local
    params: {keyframes_ckpt: null, interpolation_ckpt: null, fix_occlusion: false}
    languages: "*"
    license: Apache-2.0 (code and HF weights toninio19/keysync)
    ship_ok: true
    requires: {gpu: true, vram_gb: 14, disk_gb: 12}
    sources: ["research:F1:3", "compute-tiers:F1:spark-alt"]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: >-
      Leakage-free lower-face masking (LipLeak metric), occlusion handling. VRAM is an estimate
      (SVD-class keyframe + interpolation UNets, WavLM, SAM2.1-L; not stated upstream) — if it
      exceeds 16 GB it becomes Spark-only. Repo HEAD 5e2503b1. Model reloads per item.

  - id: musetalk-1.5
    url: https://huggingface.co/TMElyralab/MuseTalk
    params_b: null
    worker: f1_musetalk
    env: f1_musetalk
    kind: local
    params: {version: v15, bbox_shift: 0, use_float16: true}
    languages: "*"
    license: MIT (code and weights; sub-models keep their own licences)
    ship_ok: true
    requires: {gpu: true, vram_gb: 5, disk_gb: 6}
    sources: ["research:F1:6"]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: >-
      256x256 latent inpainting, fastest open option (preview renderer). README: fp16 runs on a
      4 GB laptop GPU; 5 GB with headroom. MM stack (mmcv 2.x) is the install risk on torch 2.9+
      / sm_120 (see envs/f1_musetalk.yaml). Repo HEAD 0a89dec4.

  - id: highsync
    url: https://github.com/saeed5959/high_sync
    params_b: null
    worker: f1_highsync
    env: f1_highsync
    kind: local
    params: {}
    languages: "*"
    license: MIT (code and HF weights saeed-5959/high_sync)
    ship_ok: true
    requires: {gpu: true, vram_gb: 12, disk_gb: 8}
    sources: ["research:F1:text"]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: >-
      Named in the F1 research text (HDTF FID 7.36 / CSIM 0.85 / LSE-C 7.72; silence test).
      Released with weights (github.com/saeed5959/high_sync). VRAM is an estimate for an
      SD-1.5-class latent lip-sync model; unverified.

  # ---------------------------------------------------------------- Spark only (14B/22B DiTs)
  - id: ltx-2.3-dubit-bf16
    url: https://huggingface.co/Lightricks/LTX-2.3-22b-IC-LoRA-DubIt
    params_b: 22
    worker: f1_ltx_dubit
    env: f1_ltx2
    kind: local
    params: {hf_repo: Lightricks/LTX-2.3, checkpoint: ltx-2.3-22b-distilled.safetensors,
             quantization: none, lora_repo: Lightricks/LTX-2.3-22b-IC-LoRA-DubIt,
             lora_file: ltx-2.3-22b-ic-lora-dubit-0.9.safetensors, lora_strength: 1.0,
             upsampler_repo: Lightricks/LTX-2.3,
             upsampler_file: ltx-2.3-spatial-upscaler-x2-1.1.safetensors,
             gemma_repo: google/gemma-3-12b-it-qat-q4_0-unquantized, reference_strength: 1.0,
             seed: 0, offload_mode: none}
    languages: [en, fr, es, de, ru]
    license: LTX-2 Community License (free below $10M ARR; revenue-conditional, not open source)
    ship_ok: false
    requires: {gpu: true, vram_gb: 80, disk_gb: 90, api_keys: [HF_TOKEN]}
    profiles: [spark]
    sources: ["research:F1:5", "compute-tiers:F1:big"]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: >-
      Renamed from LipDub. TEXT-driven: regenerates lips and speech from item.meta.text (items
      without it are unsupported); output carries its own generated audio. Single speaker,
      beta. VRAM estimate: 22B BF16 (~44 GB) + Gemma-3-12B (~24 GB) + VAEs/activations. Gemma is
      gated (HF_TOKEN). ship_ok false = revenue-conditional licence, not NC.

  - id: ltx-2.3-dubit-fp8
    url: https://huggingface.co/Lightricks/LTX-2.3-fp8
    params_b: 22
    worker: f1_ltx_dubit
    env: f1_ltx2
    kind: local
    params: {hf_repo: Lightricks/LTX-2.3-fp8, checkpoint: ltx-2.3-22b-distilled-fp8.safetensors,
             quantization: fp8-scaled-mm, lora_repo: Lightricks/LTX-2.3-22b-IC-LoRA-DubIt,
             lora_file: ltx-2.3-22b-ic-lora-dubit-0.9.safetensors, lora_strength: 1.0,
             upsampler_repo: Lightricks/LTX-2.3,
             upsampler_file: ltx-2.3-spatial-upscaler-x2-1.1.safetensors,
             gemma_repo: google/gemma-3-12b-it-qat-q4_0-unquantized, reference_strength: 1.0,
             seed: 0, offload_mode: none}
    languages: [en, fr, es, de, ru]
    license: LTX-2 Community License (free below $10M ARR)
    ship_ok: false
    requires: {gpu: true, vram_gb: 50, disk_gb: 60, api_keys: [HF_TOKEN]}
    profiles: [spark]
    sources: ["research:F1:5", "compute-tiers:F1:big"]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: >-
      FP8 distilled checkpoint (~29 GB file for dev-fp8; distilled similar) + Gemma BF16. Would
      need block-swap offload to fit 16 GB, which Thalassa does not do for 14B+ video models.

  - id: ltx-2.3-dubit-nvfp4
    url: https://huggingface.co/Lightricks/LTX-2.3-22b-IC-LoRA-DubIt
