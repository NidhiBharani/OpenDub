name: b3_paddleocr_vl
python: ~/.opendub/envs/b3_paddleocr_vl/bin/python
description: >-
  PaddleOCR-VL-1.6 (0.9B, Apache-2.0) through transformers ≥ 5 (AutoModelForImageTextToText); own
  venv because the other HF envs pin transformers 4.x.
setup:
  x86_64:
    - uv venv {prefix} --python 3.12
    - uv pip install --python {python} torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cu128
    - uv pip install --python {python} 'transformers>=5.0.0' accelerate pillow
  aarch64:
    - uv venv {prefix} --python 3.12
    - uv pip install --python {python} torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cu130
    - uv pip install --python {python} 'transformers>=5.0.0' accelerate pillow
check: "import transformers, torch; assert int(transformers.__version__.split('.')[0]) >= 5"
