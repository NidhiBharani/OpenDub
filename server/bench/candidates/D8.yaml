# D8 — direct S2ST (evaluate-only comparator).
# Rows from both research artifacts: data/research/model-research.html ledger (research:D8:<rank>)
# and data/research/compute-tiers.html picks (compute-tiers:D8:spark|big|api, alternates *-alt),
# docs/model-candidates-by-compute.md and plan §7 (plan:§7:D8).
# requires places each row: vram ≤ 15 → Thalassa (x86_64 16 GB) and Spark; vram > 16 → Spark only;
# arch [x86_64] where deps have no aarch64 wheels; kind api → API keys. d_unwired = registered only.
capability: D8
candidates:
- id: seamless-m4t-v2-large
  worker: d8_seamless
  env: d8_seamless
  kind: local
  params: {model: facebook/seamless-m4t-v2-large, revision: 5f8cc790b19fc3f67a61c105133b20b34e3dcb76,
    speaker_id: 0}
  languages: [en, hi, ja]
  license: CC-BY-NC-4.0
  ship_ok: false
  requires: {gpu: true, vram_gb: 8, disk_gb: 10}
  sources: ['research:D8:5']
  verified: {license: true, languages: false, vram: false, runs: false}
  notes: Speech output covers eng/hin/jpn (36 targets); no voice preservation (vocoder speakers). The
    only open direct S2ST here that covers ja→en/hi and en→hi.
  url: https://huggingface.co/facebook/seamless-m4t-v2-large
  params_b: 2.3
