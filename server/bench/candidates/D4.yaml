  verified: {license: true, languages: true, vram: false, runs: false}
  notes: ~8 GB on a 4090 per the README; 48 kHz output; no language argument (the model reads the script).
  url: https://huggingface.co/openbmb/VoxCPM2
  params_b: 2.0
