name: f1_musetalk
python: ~/.opendub/envs/f1_musetalk/bin/python
description: MuseTalk 1.5 (TMElyralab/MuseTalk @ 0a89dec4, MIT). Upstream pins torch 2.0.1/cu118 + mmcv
  2.0.1 wheels, neither of which supports sm_120/121; this recipe uses torch 2.11 and mmcv built WITHOUT
  CUDA ops (MMCV_WITH_OPS=0), which is enough for DWPose inference only if no mmcv CUDA op is hit — the
  main install risk of F1.
setup:
  x86_64:
  - uv venv {prefix} --python 3.10
  - uv pip install --python {python} torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --index-url
    https://download.pytorch.org/whl/cu128
  - test -d {home}/.opendub/src/MuseTalk || git clone https://github.com/TMElyralab/MuseTalk {home}/.opendub/src/MuseTalk
  - git -C {home}/.opendub/src/MuseTalk checkout 0a89dec45a0192b824e3cf4daf96c239440c5ed8
  - grep -v -i -E '^(torch|torchvision|torchaudio|mmcv|mmdet|mmpose|mmengine)' {home}/.opendub/src/MuseTalk/requirements.txt
    > {home}/.opendub/src/MuseTalk/requirements.arena.txt
  - uv pip install --python {python} -r {home}/.opendub/src/MuseTalk/requirements.arena.txt
  - uv pip install --python {python} openmim mmengine==0.10.7
  - MMCV_WITH_OPS=0 uv pip install --python {python} --no-build-isolation mmcv==2.1.0
  - uv pip install --python {python} mmdet==3.2.0 mmpose==1.3.2
  - cd {home}/.opendub/src/MuseTalk && PATH={prefix}/bin:$PATH sh ./download_weights.sh
  aarch64:
  - uv venv {prefix} --python 3.10
  - uv pip install --python {python} torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --index-url
    https://download.pytorch.org/whl/cu130
  - test -d {home}/.opendub/src/MuseTalk || git clone https://github.com/TMElyralab/MuseTalk {home}/.opendub/src/MuseTalk
  - git -C {home}/.opendub/src/MuseTalk checkout 0a89dec45a0192b824e3cf4daf96c239440c5ed8
  - grep -v -i -E '^(torch|torchvision|torchaudio|mmcv|mmdet|mmpose|mmengine)' {home}/.opendub/src/MuseTalk/requirements.txt
    > {home}/.opendub/src/MuseTalk/requirements.arena.txt
  - uv pip install --python {python} -r {home}/.opendub/src/MuseTalk/requirements.arena.txt
  - uv pip install --python {python} openmim mmengine==0.10.7
  - MMCV_WITH_OPS=0 uv pip install --python {python} --no-build-isolation mmcv==2.1.0
  - uv pip install --python {python} mmdet==3.2.0 mmpose==1.3.2
  - cd {home}/.opendub/src/MuseTalk && PATH={prefix}/bin:$PATH sh ./download_weights.sh
check: import torch, mmpose, mmcv; assert torch.cuda.is_available()
notes: 'If DWPose needs mmcv ops, rebuild mmcv with MMCV_WITH_OPS=1 (needs nvcc: the Spark has it, Thalassa
  does not — use pip nvidia-cuda-nvcc or a container).'
