  - id: audio-llm-mix-critic
    worker: e4_llm_critic
    kind: method
    enabled: false
    languages: "*"
    license: n/a
    sources: [compute-tiers:E4:big-alt]
    verified: {license: false, languages: false, vram: false, runs: false}
    notes: research idea, untested
  - id: nugen-lm-correct
    worker: e4_nugen
    enabled: false
    languages: "*"
    license: proprietary plugin
    ship_ok: false
    sources: [compute-tiers:E4:api-alt]
    verified: {license: true, languages: false, vram: true, runs: false}
    notes: plugin/standalone, no REST API
