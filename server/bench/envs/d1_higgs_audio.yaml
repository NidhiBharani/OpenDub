name: d1_higgs_audio
python: ~/.opendub/envs/d1_higgs_audio/bin/python
description: "Higgs Audio v3 TTS served by vLLM-Omni (worker starts `vllm serve … --omni`)"
setup:
  x86_64:
    - "uv venv {prefix} --python 3.12"
    - "uv pip install --python {python} --torch-backend cu128 torch==2.11.0 torchaudio==2.11.0"
    - "uv pip install --python {python} vllm==0.30.0"
    - "uv pip install --python {python} 'vllm-omni @ git+https://github.com/vllm-project/vllm-omni@5ce6f5dc49ead82b24bb5e1c19849cea67c51d3e'"
  aarch64:
    - "uv venv {prefix} --python 3.12"
    - "uv pip install --python {python} --torch-backend cu130 torch==2.11.0 torchaudio==2.11.0"
    - "uv pip install --python {python} vllm==0.30.0"
    - "uv pip install --python {python} 'vllm-omni @ git+https://github.com/vllm-project/vllm-omni@5ce6f5dc49ead82b24bb5e1c19849cea67c51d3e'"
check: "import vllm, torch; assert torch.cuda.is_available(); print(vllm.__version__)"
notes: "The vLLM-Omni Higgs-V3 recipe was written against vllm 0.22.0 + the higgs-v3 branch (commit 36e048fd); main (5ce6f5d, 2026-09-28) is pinned here with vllm 0.30.0 (CUDA 13 wheels on both arches, as in c2_vllm). If the pair does not load Higgs, fall back to vllm==0.22.0 + the higgs-v3 branch (x86_64) or server=external with SGLang-Omni's docker image."
