name: a4_nemo
python: ~/.opendub/envs/a4_nemo/bin/python
description: 'NVIDIA NeMo 3.0.0 (ASR collection): Parakeet, Canary, Canary-Qwen (SALM), Nemotron ASR,
  Sortformer diarization, TitaNet embeddings.'
setup:
  x86_64:
  - uv venv {prefix} --python 3.12
  - uv pip install --python {python} torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cu128
  - uv pip install --python {python} 'nemo-toolkit[asr]==3.0.0' soundfile librosa numpy
  aarch64:
  - uv venv {prefix} --python 3.12
  - uv pip install --python {python} torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cu130
  - uv pip install --python {python} 'nemo-toolkit[asr]==3.0.0' soundfile librosa numpy
check: import nemo.collections.asr, torch; assert torch.cuda.is_available()
notes: 'aarch64: a few native deps may build from source; NGC PyTorch containers are the fallback.'
