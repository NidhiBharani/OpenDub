name: a7_3dspeaker
python: ~/.opendub/envs/a7_3dspeaker/bin/python
description: 3D-Speaker models (ERes2NetV2, CAM++) through the ModelScope speaker-verification pipeline.
setup:
  x86_64:
  - uv venv {prefix} --python 3.12
  - uv pip install --python {python} torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cu128
  - uv pip install --python {python} modelscope addict datasets simplejson sortedcontainers soundfile
    librosa numpy
  aarch64:
  - uv venv {prefix} --python 3.12
  - uv pip install --python {python} torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cu130
  - uv pip install --python {python} modelscope addict datasets simplejson sortedcontainers soundfile
    librosa numpy
check: import modelscope
