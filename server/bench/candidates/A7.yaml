# A7 — speaker embeddings / voice-bank matching. Sources: model-research A7 ledger (8 rows) and
# compute-tiers A7 picks + alternates, deduplicated. All candidates embed 16 kHz audio and are
# scored by cosine (a7_common).
capability: A7
candidates:
  - id: ecapa-speechbrain
    worker: a7_speechbrain
    env: a7_speechbrain
    kind: local
    params: {model: speechbrain/spkrec-ecapa-voxceleb}
    url: https://huggingface.co/speechbrain/spkrec-ecapa-voxceleb
    params_b: 0.021
    languages: "*"
    license: Apache-2.0 code; VoxCeleb-derived weights (CC BY 4.0)
    ship_ok: true
    requires: {gpu: true, vram_gb: 1}
    baseline: true
    sources: [research:A7:7, plan:model-ranking:7]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: the encoder OpenDub's quality stage loads today (Vox1-O-clean EER 0.80 on the card)
  - id: redimnet2-b6-lm
    worker: a7_redimnet
    env: a7_redimnet
    kind: local
    params: {repo: PalabraAI/redimnet2, ref: c5bbe0b76e37df698c403f8844e41304ceab6307, entry: redimnet2, model_name: b6, train_type: lm}
    url: https://github.com/PalabraAI/redimnet2
    params_b: 0.0123
    languages: "*"
    license: MIT
    ship_ok: true
    requires: {gpu: true, vram_gb: 1}
    sources: [research:A7:1, compute-tiers:A7:spark]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: >-
      Spark pick (Vox1-O 0.26 % EER). Also a G2 similarity judge (redimnet2), so A2/D rankings
      and this candidate share a lineage. Same weights as sarvam/redimnet2-b6-vb2vox2-lm-mit and
      Wespeaker/wespeaker-voxceleb-redimnet2-B6-LM (not registered twice).
