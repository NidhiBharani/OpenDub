# E3 — acoustic scene / room matching (parked in the plan). Sources: model-research.html #E3
# (ranks 1–9) and compute-tiers.html #E3. No hosted API exists; the closed options are plugins.
capability: E3
candidates:
  - id: passthrough
    url: server/bench/arena/workers/e3_dsp.py (in-house)
    params_b: 0
    worker: e3_dsp
    kind: local
    params: {mode: passthrough}
    languages: "*"
    license: Apache-2.0
    ship_ok: true
    requires: {}
    baseline: true
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: today's behaviour — no room matching, the dry take is mixed as is
  - id: blind-parametric-dsp
    url: server/bench/arena/workers/e3_dsp.py (in-house)
    params_b: 0
    worker: e3_dsp
    kind: local
    params: {mode: blind_parametric, t60_percentile: 20, drr_at_03s: 8.0, drr_slope: 6.0}
    languages: "*"
    license: Apache-2.0
    ship_ok: true
    requires: {}
    sources: [in-house]
    verified: {license: true, languages: true, vram: true, runs: false}
    notes: >-
      Classical free-decay T60 estimate + DRR prior + exponential-noise RIR (in-house). The
      synthetic test rooms share the exponential-tail family, which flatters it slightly.
  - id: rec-rir
    url: https://github.com/Audio-WestlakeU/Rec-RIR
    worker: e3_rec_rir
    env: e3_rec_rir
    params: {repo: ~/.opendub/src/rec-rir, config: config/Rec-RIR.toml, ckpt: ckpt/epoch35.tar,
             commit: b3ac6fc1421bd58e017022037feb14f30366b46f, sr: 16000}
    languages: "*"
    license: MIT (code + checkpoint in repo)
    ship_ok: true
    requires: {gpu: true, vram_gb: 3, disk_gb: 1, arch: [x86_64]}
    sources: [research:E3:2, compute-tiers:E3:spark-alt]
    verified: {license: true, languages: true, vram: false, runs: false}
    notes: >-
      Blind RIR identification (16 kHz); needs mamba-ssm/causal-conv1d CUDA extensions (x86_64
      only here). Estimation runs once per job in load(), so rtfx excludes it.
  # ---- registered, not runnable
  - id: flamo-fdn-matching
    url: https://arxiv.org/abs/2510.23158
    worker: e3_flamo_fdn
