      worker: d1_f5_tts
      params:
        model: F5TTS_v1_Base
        languages: [en, zh]
    fade_ms: 30
  languages: [en, zh]
  license: CC-BY-NC-4.0 (inner F5)
  ship_ok: false
  requires: {gpu: true, vram_gb: 3, disk_gb: 2}
  sources: ['research:D7:1', 'compute-tiers:D7:spark']
  verified: {license: false, languages: false, vram: false, runs: false}
  notes: Pass-through splice of the source vocalisation around F5 speech (research primary); the CED/BEATs
    gate is upstream (A8) — here the pack says where events are.
  url: https://github.com/SWivid/F5-TTS
  params_b: 0.34
