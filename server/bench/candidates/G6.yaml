    kind: api
    params: {model: gemini-3.7-flash, task: review, protocol: holistic,
             prices: {in: 0.75, out: 3.75}}
    languages: "*"
    license: proprietary API
    ship_ok: true
    requires: {api_keys: [GEMINI_API_KEY]}
    url: https://ai.google.dev/gemini-api/docs/models
    sources: [compute-tiers:G6:api]
    verified: {license: true, languages: false, vram: true, runs: false}
    notes: API pick (audio + video natively). Promo price through 2026-12-31, then $1.50 / $7.50.
