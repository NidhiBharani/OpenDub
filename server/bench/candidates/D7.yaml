# D7 — non-verbal vocalisations.
# Rows from both research artifacts: data/research/model-research.html ledger (research:D7:<rank>)
# and data/research/compute-tiers.html picks (compute-tiers:D7:spark|big|api, alternates *-alt),
# docs/model-candidates-by-compute.md and plan §7 (plan:§7:D7).
# requires places each row: vram ≤ 15 → Thalassa (x86_64 16 GB) and Spark; vram > 16 → Spark only;
# arch [x86_64] where deps have no aarch64 wheels; kind api → API keys. d_unwired = registered only.
capability: D7
candidates:
