# D4 — regional / low-resource voices.
# Rows from both research artifacts: data/research/model-research.html ledger (research:D4:<rank>)
# and data/research/compute-tiers.html picks (compute-tiers:D4:spark|big|api, alternates *-alt),
# docs/model-candidates-by-compute.md and plan §7 (plan:§7:D4).
# requires places each row: vram ≤ 15 → Thalassa (x86_64 16 GB) and Spark; vram > 16 → Spark only;
# arch [x86_64] where deps have no aarch64 wheels; kind api → API keys. d_unwired = registered only.
capability: D4
candidates:
- id: f5-hindi-small
  worker: d1_f5_tts
  env: server
  kind: local
  params:
    model: F5TTS_Small
    ckpt_file: hf://SPRINGLab/F5-Hindi-24KHz/model_2500000.safetensors
    vocab_file: hf://SPRINGLab/F5-Hindi-24KHz/vocab.txt
    languages: [hi]
  languages: [hi]
  license: CC-BY-4.0
  ship_ok: true
  requires: {gpu: true, vram_gb: 2, disk_gb: 1}
  sources: ['plan:§7:D1']
  verified: {license: true, languages: true, vram: false, runs: false}
  notes: 'SPRINGLab F5-Hindi-24KHz (F5TTS_Small config, as in the app provider''s placeholder). Non-Devanagari
    reference transcripts are outside its vocab: see the translit row.'
  url: https://huggingface.co/SPRINGLab/F5-Hindi-24KHz
  params_b: 0.16
  baseline: true
