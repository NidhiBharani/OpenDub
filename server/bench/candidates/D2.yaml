# docs/model-candidates-by-compute.md and plan §7 (plan:§7:D2).
# requires places each row: vram ≤ 15 → Thalassa (x86_64 16 GB) and Spark; vram > 16 → Spark only;
# arch [x86_64] where deps have no aarch64 wheels; kind api → API keys. d_unwired = registered only.
capability: D2
